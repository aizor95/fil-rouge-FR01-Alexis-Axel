<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusLink - Nom de la page</title>
  <!-- Lien vers la feuille de style CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  
  <header>
    <div class="logo">CampusLink</div>
    <nav>
      <ul>
        <li><a href="index.html">Tableau de bord</a></li>
        <li><a href="salles.html">Salles</a></li>
        <li><a href="equipements.html">Équipements</a></li>
        <li><a href="incidents.html">Incidents</a></li>
      </ul>
    </nav>
  </header>

  
  <main>
    <h1>Incidents</h1>
    <section>
    <h2>Déclarer un incident</h2>
    <form action="#" method="post">
      <p>
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" autocomplete="name" required>
      </p>
      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </p>
      <p>
        <label for="salle">Salle</label>
        <input type="text" id="salle" name="salle" autocomplete="Salle" required>
      </p>
      <p>
        <label for="equipment">Équipement concerné</label>
        <input type="text" id="equipment" name="equipment" autocomplete="Équipement" required>
      </p>
      <p>
        <label for="sujet">Sujet</label>
        <input type="text" id="sujet=" name="Sujet" required>
      </p>
      <p>
        <label for="desc">Description de l'incident <span class="aide">(projecteur cassé, chaise manquante...)</span></label>
        <textarea id="desc" name="desc" rows="4" required></textarea>
      </p>
      <p>
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
      </p>
      <button type="submit">Envoyer l'incident</button>
    </form>
  </section>
  </main>

  
  <footer>
    <p>&copy; 2026 CampusLink - Tous droits réservés</p>
  </footer>

</body>
</html>
